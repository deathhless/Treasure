<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль — Treasure</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .profile-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 24px;
      align-items: start;
    }
    .profile-card {
      background: white;
      border-radius: var(--radius);
      padding: 32px 24px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .profile-avatar {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: var(--dark);
      color: var(--gold);
      font-size: 32px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
    }
    .profile-card__name  { font-size: 20px; font-weight: bold; margin-bottom: 4px; }
    .profile-card__email { color: var(--gray); font-size: 14px; margin-bottom: 12px; }
    .profile-stat {
      display: flex;
      justify-content: space-around;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #eee;
    }
    .profile-stat__val   { font-size: 24px; font-weight: bold; color: var(--gold); }
    .profile-stat__label { font-size: 12px; color: var(--gray); }
    @media (max-width: 768px) {
      .profile-layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 style="margin-bottom:24px">Профиль</h1>
    <div class="profile-layout">

      <!-- Левая колонка — карточка пользователя -->
      <div>
        <div class="profile-card">
          <div class="profile-avatar" id="avatar">👤</div>
          <div class="profile-card__name"  id="card-name">—</div>
          <div class="profile-card__email" id="card-email">—</div>
          <span class="book-card__genre"   id="card-level">—</span>
          <div class="profile-stat">
            <div>
              <div class="profile-stat__val"   id="stat-purchases">—</div>
              <div class="profile-stat__label">книг куплено</div>
            </div>
            <div>
              <div class="profile-stat__val"   id="stat-bonus">—</div>
              <div class="profile-stat__label">бонусов</div>
            </div>
          </div>
        </div>
        <div style="margin-top:12px; text-align:center">
          <a href="bonus.html" class="btn btn-outline" style="width:100%; display:block">
            🎁 Бонусная программа
          </a>
        </div>
      </div>

      <!-- Правая колонка — форма редактирования -->
      <div style="background:white; border-radius:var(--radius); padding:32px; box-shadow:var(--shadow)">
        <h2 style="margin-bottom:24px">Редактировать данные</h2>
        <div id="msg"></div>

        <div class="form-group">
          <label>Имя</label>
          <input type="text" id="inp-name" placeholder="Ваше имя" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="inp-email" placeholder="email@example.com" />
        </div>
        <div class="form-group">
          <label>Новый пароль <span style="color:var(--gray)">(оставьте пустым, чтобы не менять)</span></label>
          <input type="password" id="inp-password" placeholder="Минимум 6 символов" />
        </div>
        <button class="btn btn-primary" id="btn-save" onclick="saveProfile()">
          Сохранить изменения
        </button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    let userId;

    document.addEventListener('DOMContentLoaded', async () => {
      requireLogin();
      const user = getUser();
      userId = user.id;

      // Заполняем карточку из localStorage (быстро)
      document.getElementById('avatar').textContent      = user.name?.[0]?.toUpperCase() ?? '👤';
      document.getElementById('card-name').textContent   = user.name;
      document.getElementById('card-email').textContent  = user.email;
      document.getElementById('card-level').textContent  = user.level ?? 'Новичок';
      document.getElementById('stat-bonus').textContent  = user.bonus_points ?? 0;
      document.getElementById('inp-name').value  = user.name;
      document.getElementById('inp-email').value = user.email;

      // Подгружаем количество покупок с сервера
      try {
        const purchases = await api.get('/purchases');
        document.getElementById('stat-purchases').textContent = purchases.length;
      } catch (e) {
        document.getElementById('stat-purchases').textContent = '—';
      }
    });

    async function saveProfile() {
      const btn      = document.getElementById('btn-save');
      const msg      = document.getElementById('msg');
      const name     = document.getElementById('inp-name').value.trim();
      const email    = document.getElementById('inp-email').value.trim();
      const password = document.getElementById('inp-password').value;

      if (!name || !email) {
        msg.innerHTML = '<div class="alert alert-error">Имя и email обязательны</div>';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Сохраняем...';
      msg.innerHTML = '';

      try {
        const body = { name, email };
        if (password) body.password = password;

        await api.put(`/users/${userId}`, body);

        // Обновляем localStorage
        const user = getUser();
        user.name  = name;
        user.email = email;
        saveUser(user);

        // Обновляем карточку
        document.getElementById('card-name').textContent  = name;
        document.getElementById('card-email').textContent = email;
        document.getElementById('avatar').textContent     = name[0].toUpperCase();
        document.getElementById('inp-password').value     = '';

        msg.innerHTML = '<div class="alert alert-success">✅ Профиль обновлён</div>';
      } catch (e) {
        msg.innerHTML = `<div class="alert alert-error">${e.message}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Сохранить изменения';
      }
    }
  </script>
</body>
</html>
