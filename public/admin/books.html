<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Книги — Админка</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <!-- Шапка с навигацией по разделам -->
    <div style="display:flex; gap:16px; margin-bottom:24px; flex-wrap:wrap; align-items:center">
      <strong style="font-size:18px">Админка:</strong>
      <a href="books.html"  class="btn btn-primary" style="padding:6px 14px">Книги</a>
      <a href="genres.html" class="btn btn-outline"  style="padding:6px 14px">Жанры</a>
      <a href="users.html"  class="btn btn-outline"  style="padding:6px 14px">Пользователи</a>
      <a href="../index.html" style="margin-left:auto; color:var(--gray)">← На сайт</a>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:12px">
      <h1>Книги</h1>
      <button class="btn btn-gold" onclick="openModal()">+ Добавить книгу</button>
    </div>

    <!-- Поиск -->
    <input
      type="text" id="search"
      placeholder="Поиск по названию или автору..."
      style="width:100%; padding:10px 14px; border:1px solid #ddd;
             border-radius:var(--radius); font-size:15px; margin-bottom:16px; outline:none"
      oninput="filterBooks()"
    />

    <div class="table-wrap">
      <table id="books-table">
        <thead>
          <tr>
            <th>Обложка</th>
            <th>Название / Автор</th>
            <th>Жанр</th>
            <th>Цена</th>
            <th>Просмотры</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="books-body"></tbody>
      </table>
    </div>
    <p id="loading" style="text-align:center; color:var(--gray); margin-top:32px">Загрузка...</p>
  </div>

  <!-- Модальное окно: создать / редактировать -->
  <div class="modal-overlay" id="modal" style="display:none">
    <div class="modal">
      <div class="modal__header">
        <h2 id="modal-title">Добавить книгу</h2>
        <button class="modal__close" onclick="closeModal()">✕</button>
      </div>
      <div id="modal-msg"></div>
      <div class="form-group">
        <label>Название *</label>
        <input type="text" id="f-title" placeholder="Название книги" />
      </div>
      <div class="form-group">
        <label>Автор *</label>
        <input type="text" id="f-author" placeholder="Имя автора" />
      </div>
      <div class="form-group">
        <label>Жанр</label>
        <select id="f-genre"></select>
      </div>
      <div class="form-group">
        <label>Цена (₽)</label>
        <input type="number" id="f-price" placeholder="0 = бесплатно" min="0" />
      </div>
      <div class="form-group">
        <label>URL обложки</label>
        <input type="text" id="f-cover" placeholder="https://..." />
      </div>
      <div class="form-group">
        <label>Описание</label>
        <textarea id="f-desc" rows="4" placeholder="Краткое описание книги"></textarea>
      </div>
      <div class="form-group">
        <label>Текст книги</label>
        <textarea id="f-content" rows="6" placeholder="Полный текст или первые главы"></textarea>
      </div>
      <div style="display:flex; gap:12px; justify-content:flex-end">
        <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
        <button class="btn btn-primary" id="modal-save" onclick="saveBook()">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Подтверждение удаления -->
  <div class="modal-overlay" id="confirm" style="display:none">
    <div class="modal" style="max-width:360px; text-align:center">
      <p style="font-size:18px; margin-bottom:24px">
        Удалить книгу <strong id="confirm-title"></strong>?
      </p>
      <div style="display:flex; gap:12px; justify-content:center">
        <button class="btn btn-outline" onclick="document.getElementById('confirm').style.display='none'">Отмена</button>
        <button class="btn btn-danger"  id="confirm-ok">Удалить</button>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/navbar.js"></script>
  <script>
    let allBooks = [];
    let editId   = null;
    let genres   = [];

    document.addEventListener('DOMContentLoaded', async () => {
      requireAdmin();
      await loadGenres();
      await loadBooks();
    });

    async function loadGenres() {
      try {
        genres = await api.get('/genres');
        const sel = document.getElementById('f-genre');
        sel.innerHTML = '<option value="">Без жанра</option>' +
          genres.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
      } catch (e) {}
    }

    async function loadBooks() {
      try {
        allBooks = await api.get('/books');
        document.getElementById('loading').style.display = 'none';
        renderTable(allBooks);
      } catch (e) {
        document.getElementById('loading').textContent = 'Ошибка загрузки: ' + e.message;
      }
    }

    function renderTable(books) {
      document.getElementById('books-body').innerHTML = books.map(b => `
        <tr>
          <td>
            <img src="${b.cover_url || '../img/placeholder.png'}"
              onerror="this.src='../img/placeholder.png'"
              style="width:36px; height:50px; object-fit:cover; border-radius:4px" />
          </td>
          <td>
            <strong>${b.title}</strong><br>
            <span style="color:var(--gray); font-size:13px">${b.author}</span>
          </td>
          <td>${b.genre_name ?? '—'}</td>
          <td>${b.price > 0 ? b.price + ' ₽' : 'Бесплатно'}</td>
          <td>${b.views_count}</td>
          <td>
            <button class="btn btn-outline" style="padding:4px 10px; font-size:13px; margin-right:4px"
              onclick="openEdit(${b.id})">✏️</button>
            <button class="btn btn-danger" style="padding:4px 10px; font-size:13px"
              onclick="confirmDelete(${b.id}, '${b.title.replace(/'/g,"\\'")}')">🗑️</button>
          </td>
        </tr>
      `).join('');
    }

    function filterBooks() {
      const q = document.getElementById('search').value.toLowerCase();
      renderTable(allBooks.filter(b =>
        b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q)
      ));
    }

    function openModal(book = null) {
      editId = book ? book.id : null;
      document.getElementById('modal-title').textContent = book ? 'Редактировать книгу' : 'Добавить книгу';
      document.getElementById('f-title').value   = book?.title       ?? '';
      document.getElementById('f-author').value  = book?.author      ?? '';
      document.getElementById('f-genre').value   = book?.genre_id    ?? '';
      document.getElementById('f-price').value   = book?.price       ?? '';
      document.getElementById('f-cover').value   = book?.cover_url   ?? '';
      document.getElementById('f-desc').value    = book?.description ?? '';
      document.getElementById('f-content').value = book?.content     ?? '';
      document.getElementById('modal-msg').innerHTML = '';
      document.getElementById('modal').style.display = 'flex';
    }

    function openEdit(id) {
      const book = allBooks.find(b => b.id === id);
      if (book) openModal(book);
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    async function saveBook() {
      const btn = document.getElementById('modal-save');
      const msg = document.getElementById('modal-msg');
      const body = {
        title:       document.getElementById('f-title').value.trim(),
        author:      document.getElementById('f-author').value.trim(),
        genre_id:    document.getElementById('f-genre').value || null,
        price:       parseFloat(document.getElementById('f-price').value) || 0,
        cover_url:   document.getElementById('f-cover').value.trim(),
        description: document.getElementById('f-desc').value.trim(),
        content:     document.getElementById('f-content').value.trim(),
      };
      if (!body.title || !body.author) {
        msg.innerHTML = '<div class="alert alert-error">Название и автор обязательны</div>';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Сохраняем...';
      try {
        if (editId) {
          await api.put(`/books/${editId}`, body);
        } else {
          await api.post('/books', body);
        }
        closeModal();
        await loadBooks();
      } catch (e) {
        msg.innerHTML = `<div class="alert alert-error">${e.message}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Сохранить';
      }
    }

    function confirmDelete(id, title) {
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm').style.display = 'flex';
      document.getElementById('confirm-ok').onclick = async () => {
        document.getElementById('confirm').style.display = 'none';
        try {
          await api.delete(`/books/${id}`);
          await loadBooks();
        } catch (e) { alert(e.message); }
      };
    }
  </script>
</body>
</html>
