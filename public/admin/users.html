<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пользователи — Админка</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <div style="display:flex; gap:16px; margin-bottom:24px; flex-wrap:wrap; align-items:center">
      <strong style="font-size:18px">Админка:</strong>
      <a href="books.html"  class="btn btn-outline" style="padding:6px 14px">Книги</a>
      <a href="genres.html" class="btn btn-outline" style="padding:6px 14px">Жанры</a>
      <a href="users.html"  class="btn btn-primary" style="padding:6px 14px">Пользователи</a>
      <a href="../index.html" style="margin-left:auto; color:var(--gray)">← На сайт</a>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:12px">
      <h1>Пользователи</h1>
    </div>

    <input
      type="text" id="search"
      placeholder="Поиск по имени или email..."
      style="width:100%; padding:10px 14px; border:1px solid #ddd;
             border-radius:var(--radius); font-size:15px; margin-bottom:16px; outline:none"
      oninput="filterUsers()"
    />

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Имя</th>
            <th>Email</th>
            <th>Роль</th>
            <th>Уровень</th>
            <th>Бонусы</th>
            <th>Регистрация</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="users-body"></tbody>
      </table>
    </div>
    <p id="loading" style="text-align:center; color:var(--gray); margin-top:32px">Загрузка...</p>
  </div>

  <div class="modal-overlay" id="confirm" style="display:none">
    <div class="modal" style="max-width:360px; text-align:center">
      <p style="font-size:18px; margin-bottom:24px">
        Удалить пользователя <strong id="confirm-name"></strong>?<br>
        <span style="color:var(--gray); font-size:14px">Это удалит все его покупки, отзывы и прогресс.</span>
      </p>
      <div style="display:flex; gap:12px; justify-content:center">
        <button class="btn btn-outline" onclick="document.getElementById('confirm').style.display='none'">Отмена</button>
        <button class="btn btn-danger"  id="confirm-ok">Удалить</button>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/navbar.js"></script>
  <script>
    let allUsers = [];

    document.addEventListener('DOMContentLoaded', async () => {
      requireAdmin();
      try {
        allUsers = await api.get('/users');
        document.getElementById('loading').style.display = 'none';
        renderTable(allUsers);
      } catch (e) {
        document.getElementById('loading').textContent = 'Ошибка: ' + e.message;
      }
    });

    function renderTable(users) {
      const me = getUser();
      document.getElementById('users-body').innerHTML = users.map(u => {
        const date = new Date(u.created_at).toLocaleDateString('ru-RU');
        const isMe = me && me.id === u.id;
        return `
          <tr>
            <td>${u.id}</td>
            <td><strong>${u.name}</strong> ${isMe ? '<span style="color:var(--gold)">(вы)</span>' : ''}</td>
            <td style="color:var(--gray)">${u.email}</td>
            <td>
              <span style="
                background:${u.role === 'admin' ? 'var(--gold)' : '#eee'};
                color:${u.role === 'admin' ? 'var(--dark)' : 'var(--gray)'};
                padding:2px 8px; border-radius:12px; font-size:12px
              ">${u.role}</span>
            </td>
            <td>${u.level ?? '—'}</td>
            <td style="color:var(--gold)">${u.bonus_points}</td>
            <td style="white-space:nowrap">${date}</td>
            <td>
              ${!isMe ? `
                <button class="btn btn-danger" style="padding:4px 10px; font-size:13px"
                  onclick="confirmDelete(${u.id}, '${u.name.replace(/'/g,"\\'")}')">🗑️</button>
              ` : '—'}
            </td>
          </tr>
        `;
      }).join('');
    }

    function filterUsers() {
      const q = document.getElementById('search').value.toLowerCase();
      renderTable(allUsers.filter(u =>
        u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q)
      ));
    }

    function confirmDelete(id, name) {
      document.getElementById('confirm-name').textContent = name;
      document.getElementById('confirm').style.display = 'flex';
      document.getElementById('confirm-ok').onclick = async () => {
        document.getElementById('confirm').style.display = 'none';
        try {
          await api.delete(`/users/${id}`);
          allUsers = allUsers.filter(u => u.id !== id);
          renderTable(allUsers);
        } catch (e) { alert(e.message); }
      };
    }
  </script>
</body>
</html>
